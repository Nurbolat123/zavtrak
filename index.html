<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>Дежурный по завтракам</title>
  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: #222;
      background: #f5fbff;
    }

    body {
      overflow-x: hidden;
    }

    /* Фон со вкусностями */
    .background {
      position: fixed;
      top: -80px;
      left: -80px;
      display: grid;
      grid-template-columns: repeat(var(--cols, 5), 100px);
      grid-auto-rows: 100px;
      justify-items: center;
      align-items: center;
      z-index: 0;
      opacity: 0.3;
      pointer-events: none;
      animation: moveBackground 40s linear infinite alternate;
    }

    .emoji {
      font-size: 2.8rem;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Анимация только у части эмодзи — меньше нагрузка на батарею */
    .emoji.float {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Сдвиг не больше запаса (80px), чтобы по краям не появлялись пустые полосы */
    @keyframes moveBackground {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-50px, -30px); }
      100% { transform: translate(50px, 50px); }
    }

    /* Центральный контент */
    .content {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 0.5rem;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px 20px;
      border-radius: 10px;
    }

    h2 {
      font-size: 2.8rem;
      margin: 0.5rem 0 1.5rem;
      color: #0078ff;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px 20px;
      border-radius: 10px;
      /* Видим по умолчанию: если анимация не сработает, имя всё равно будет на экране */
      animation:
        appear 1s ease-out 0.2s backwards,
        pulse 1.5s ease-in-out 1.2s infinite alternate;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      from { transform: scale(1); color: #0078ff; }
      to { transform: scale(1.06); color: #005ecb; }
    }

    /* Кнопка */
    .toggle-btn {
      padding: 12px 22px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: background 0.3s;
    }

    .toggle-btn:hover,
    .toggle-btn:active {
      background: #005ecb;
    }

    /* Всплывающее окно (в потоке, чтобы не налезало на заголовки и прокручивалось) */
    .popup {
      box-sizing: border-box;
      margin-top: 16px;
      width: min(92vw, 320px);
      max-height: 60vh;
      max-height: 60dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: left;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .popup.open {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .popup h3 {
      margin-top: 0;
      font-size: 1rem;
      color: #0078ff;
    }

    .popup ul {
      margin: 0;
      padding-left: 18px;
    }

    .popup li {
      margin-bottom: 4px;
    }

    .popup p {
      font-size: 0.9rem;
      margin: 10px 0 0;
      color: #444;
    }

    .popup a {
      color: #0078ff;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.4rem; }
      h2 { font-size: 2rem; }
      .emoji { font-size: 2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .background, .emoji.float, h2, .popup {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="background" id="bg" aria-hidden="true"></div>

  <div class="content">
    <h1>Дежурный, который принесет завтрак в пятницу:</h1>
    <h2 id="name">Загрузка...</h2>

    <button class="toggle-btn" id="toggleBtn" type="button" aria-expanded="false" aria-controls="popup">Показать список продуктов</button>

    <div class="popup" id="popup">
      <h3>🛒 Список продуктов:</h3>
      <ul id="itemsList"></ul>
      <p>📞 Для заказа: <a href="tel:+77754175760"><strong>+7 777 000 01 03</strong></a></p>
      <p>💬 <a id="waLink" href="https://wa.me/77754175760" target="_blank" rel="noopener noreferrer">Написать в WhatsApp</a></p>
    </div>
  </div>

<script>
  // --- Фон ---
  // 🫓 (iOS 14.2+) заменён на 🍞, чтобы на старых iPhone не было «квадратиков»
  const emojis = ["🥐", "🥞", "🥟", "🍩", "🥯", "🥮", "🥧", "🍞", "🍪"];
  const bg = document.getElementById('bg');
  // +160px — запас под смещение фона (top/left: -80px), +1 — на округление
  const cols = Math.ceil((window.innerWidth + 160) / 100) + 1;
  const rows = Math.ceil((window.innerHeight + 160) / 100) + 1;
  bg.style.setProperty('--cols', cols);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const emoji = document.createElement('div');
      emoji.className = 'emoji' + ((r + c) % 3 === 0 ? ' float' : '');
      emoji.textContent = emojis[(r + c) % emojis.length];
      bg.appendChild(emoji);
    }
  }

  // --- Список дежурных ---
  const employees = [
    "Асемгуль", "Гулжазира", "Роза", "Жамель", "Гульдерай",
    "Альфия", "Аңсаған", "Жанара", "Радмила", "Арман",
    "Ольга", "Мадина", "Әйгерім", "Мақсат", "Данияр", "Бекжан",
    "Рустем", "Айбарша", "Динара", "Базик",
    "Зарина", "Айзат", "Римма", "Сурия"
  ];

  // --- Список продуктов (единый источник для списка и для WhatsApp) ---
  const items = [
    ["Беляши", 10],
    ["Пирожок с картошкой", 17],
    ["Пирожок с капустой", 8],
    ["Сосиска в тесте", 7],
    ["Блины с творогом", 7],
    ["Блины со сгущенкой", 7],
    ["Самса", 5],
    ["Заварное", 1],
    ["Вафли", 1]
  ];

  // Сегодняшняя календарная дата в Алматы как UTC-полночь (не зависит от часового пояса устройства
  // и от формата локали). Результат: число миллисекунд Date.UTC(год, месяц, день).
  function almatyToday() {
    try {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Almaty", year: "numeric", month: "numeric", day: "numeric"
      }).formatToParts(new Date());
      const get = (type) => parseInt(parts.find((p) => p.type === type).value, 10);
      const result = Date.UTC(get("year"), get("month") - 1, get("day"));
      if (!isNaN(result)) return result;
    } catch (e) { /* Intl с часовыми поясами недоступен — используем запасной вариант */ }
    // Запасной вариант: Алматы = UTC+5
    const d = new Date(Date.now() + 5 * 3600000);
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }

  const today = new Date(almatyToday());

  // 🔥 ЯКОРЬ: ЧЕТВЕРГ 23.04.2026 — Асемгуль
  const startThursday = Date.UTC(2026, 3, 23);

  // Сколько дней прошло
  const diffDays = Math.floor((today.getTime() - startThursday) / 86400000);

  // Номер недели от четверга
  const weekNumber = Math.floor(diffDays / 7);

  // Дежурный (корректный модуль и для дат до якоря)
  const dutyName = employees[((weekNumber % employees.length) + employees.length) % employees.length];

  // День недели в Алматы: 4 = чт, 5 = пт
  const day = today.getUTCDay();
  const nameEl = document.getElementById("name");

  if (day === 4) {
    nameEl.textContent = `Завтра дежурит: ${dutyName} ☕`;
  } else if (day === 5) {
    nameEl.textContent = `Сегодня дежурит: ${dutyName} 🥐`;
  } else {
    nameEl.textContent = "Ждите следующей пятницы ☕🥐";
  }

  // --- Список продуктов и ссылка WhatsApp ---
  const list = document.getElementById("itemsList");
  items.forEach(([title, count]) => {
    const li = document.createElement("li");
    li.textContent = `${title} - ${count} шт.`;
    list.appendChild(li);
  });

  const orderText = "Здравствуйте! Хочу заказать завтрак на пятницу:\n" +
    items.map(([title, count]) => `${title} - ${count} шт.`).join("\n");
  document.getElementById("waLink").href =
    "https://wa.me/77754175760?text=" + encodeURIComponent(orderText);

  // --- Кнопка и всплывающее окно ---
  const toggleBtn = document.getElementById("toggleBtn");
  const popup = document.getElementById("popup");

  toggleBtn.addEventListener("click", () => {
    const visible = popup.classList.toggle("open");
    toggleBtn.setAttribute("aria-expanded", String(visible));
    toggleBtn.textContent = visible ? "Скрыть список продуктов" : "Показать список продуктов";
    if (visible) popup.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
</script>
</body>
</html>
